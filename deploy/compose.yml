# Production stack on the server (/opt/crm/prod), started by deploy.sh.
# Values come from .env next to this file; APP_IMAGE is set by deploy.sh.
name: prod

x-logging: &logging
  # Container logs are capped: at most 3 files of 10 MB per container
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    # No published port: the database is reachable only from the app containers
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits
  migrate:
    image: ${APP_IMAGE:?Run deploy.sh or set APP_IMAGE}
    command: ["node", "db/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Not started by "up": deploy.sh runs it explicitly
    profiles: [tools]
    logging: *logging

  app:
    image: ${APP_IMAGE:?Run deploy.sh or set APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      # Only nginx on this server talks to the app
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
