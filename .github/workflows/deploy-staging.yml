name: Deploy staging

# Every merge into main: build the app image (tagged with the commit SHA), push
# it to GHCR and deploy it to staging. Prod is deployed only by hand, with the
# Deploy prod workflow, and only a SHA that passed this one
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time: a newer push waits until the running one finishes, so
# deploys follow the merges in order. The server scripts also take a lock of
# their own per environment (lib.sh, acquire_lock)
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      # Deploy prod trusts green runs of this workflow on main only
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Deploy staging from the main branch"
          exit 1

      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The first pull on the server is slow (~150 KB/s from GHCR)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to staging
        run: bash deploy/ci.sh staging "$IMAGE"
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
