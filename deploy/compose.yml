# One stack for every environment on the server, started by deploy.sh from the
# environment's folder (/opt/crm/prod, /opt/crm/staging). The project name
# (-p prod, -p staging) keeps the containers and the database volume apart.
# Values come from .env next to this file; APP_IMAGE and APP_PORT are set by
# the scripts (lib.sh, deploy.sh).

# Container logs go to the server journal (journald): they outlive deploys and
# rollbacks, and the journal's own size limit drops the oldest lines
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    # No published port: the database is reachable only from the app containers
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Two environments and the landing share one server: none may take it all
    mem_limit: ${DB_MEM_LIMIT:-256m}
    logging: *logging

  # One-off container from the app image: applies migrations and exits
  migrate:
    image: ${APP_IMAGE:?Run deploy.sh or set APP_IMAGE}
    command: ["node", "db/migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Who gets the contacts and groups made before there were users. Needed
      # only while the database holds such data: without it the migration
      # fails on a database with data and the new version does not start
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Not started by "up": deploy.sh runs it explicitly
    profiles: [tools]
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging: *logging

  app:
    image: ${APP_IMAGE:?Run deploy.sh or set APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Login: the secret signs the sessions, the address is the one links in
      # emails point to (each environment its own), SMTP_URL is the mail
      # server (Resend, each environment its own key)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in .env}
    ports:
      # Only nginx on this server talks to the app: prod on 3000, staging on 3001
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-512m}
    logging: *logging

volumes:
  db-data:
