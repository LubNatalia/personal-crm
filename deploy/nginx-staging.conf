# nginx site for the staging environment: test-app.lyna.tech -> 127.0.0.1:3001.
# A site of its own, next to the prod and landing site (lyna.tech), which it
# does not touch. Installed by hand once (see README, "Тест-стенд"):
#   sudo cp /opt/crm/staging/nginx-staging.conf /etc/nginx/sites-available/test-app.lyna.tech
#   sudo ln -s /etc/nginx/sites-available/test-app.lyna.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate is its own too (webroot, like the prod one; certbot renews it
# and reloads nginx by itself). Issue it before installing this file, with the
# HTTP part only, else nginx -t fails on the missing certificate:
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d test-app.lyna.tech \
#     --deploy-hook "systemctl reload nginx"
# The whole site asks for a login and password (file made by hand, see README);
# only Let's Encrypt's certificate check gets through without it.

server {
    listen 80;
    listen [::]:80;
    server_name test-app.lyna.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test-app.lyna.tech;

    ssl_certificate     /etc/letsencrypt/live/test-app.lyna.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.lyna.tech/privkey.pem;

    # Keeps the test copy out of search engines even if the password leaks
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        auth_basic "Test environment";
        auth_basic_user_file /etc/nginx/htpasswd-test-app;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
