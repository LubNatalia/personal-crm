name: personal-crm

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends (login links): nothing leaves the machine.
  # SMTP on 1025, the inbox page on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      # Without this every SMTP connection waits ~8 s for a reverse DNS lookup
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      # Bound to localhost only, like the database
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
